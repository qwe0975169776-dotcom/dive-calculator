<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潛水旅費動態結算器</title>
<style>
  :root {
    --bg: #f1f3f6;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --border: #e2e6ea;
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --green: #16a34a;
    --green-dark: #15803d;
    --red: #dc2626;
    --red-dark: #b91c1c;
    --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  h1 {
    text-align: center;
    margin: 8px 0 24px;
    font-size: 1.6rem;
  }

  h2 {
    margin: 0 0 16px;
    font-size: 1.2rem;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 20px;
  }

  /* ---------- 表單 Grid ---------- */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  @media (min-width: 640px) {
    .form-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  }

  .field label {
    display: block;
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field input[type="text"],
  .field input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .field .unit {
    font-size: 0.8rem;
    color: var(--muted);
  }

  .check-field {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    align-self: end;
  }
  .check-field input { width: 20px; height: 20px; cursor: pointer; }

  /* ---------- 按鈕 ---------- */
  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
  }
  .btn {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-blue { background: var(--blue); flex: 1 1 100%; }
  .btn-blue:hover { background: var(--blue-dark); }
  .btn-green { background: var(--green); flex: 1 1 240px; }
  .btn-green:hover { background: var(--green-dark); }
  .btn-red { background: var(--red); flex: 1 1 160px; }
  .btn-red:hover { background: var(--red-dark); }
  .btn-gray { background: #4b5563; }
  .btn-gray:hover { background: #374151; }
  .btn-small {
    padding: 8px 12px;
    font-size: 0.9rem;
    background: #fff;
    color: var(--red);
    border: 1px solid var(--red);
  }
  .btn-small:hover { background: var(--red); color: #fff; }
  .btn-edit {
    color: var(--blue);
    border-color: var(--blue);
  }
  .btn-edit:hover { background: var(--blue); color: #fff; }
  .card-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  @media (min-width: 480px) {
    .card-actions { flex-direction: row; }
  }
  .member-card.editing {
    border-left-color: #f59e0b;
    background: #fffbeb;
    outline: 2px solid #f59e0b;
  }
  .edit-badge {
    display: inline-block;
    font-size: 0.75rem;
    background: #f59e0b;
    color: #fff;
    border-radius: 6px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .card.edit-mode {
    outline: 3px solid #f59e0b;
  }
  .btn-orange { background: #f59e0b; flex: 1 1 100%; }
  .btn-orange:hover { background: #d97706; }

  /* ---------- 成員卡片 ---------- */
  .member-list { display: flex; flex-direction: column; gap: 12px; }
  .member-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 14px 18px;
    border-left: 5px solid var(--blue);
  }
  .member-info { min-width: 0; }
  .member-name {
    font-size: 1.05rem;
    font-weight: 600;
    word-break: break-all;
  }
  .member-detail {
    font-size: 0.82rem;
    color: var(--muted);
  }
  .member-total {
    color: var(--red);
    font-weight: 800;
    font-size: 1.5rem;
  }
  .empty-hint {
    text-align: center;
    color: var(--muted);
    padding: 20px;
  }
  .list-summary {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
    color: var(--muted);
  }
  .list-summary strong { color: var(--text); }

  /* ---------- 第二畫面：表格 ---------- */
  #reportView { display: none; }

  .report-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .table-wrap {
    overflow: auto;
    max-height: 70vh;
    border: 1px solid #d0d5dc;
    border-radius: 10px;
    background: #fff;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 900px;
    font-size: 0.95rem;
  }
  th, td {
    border: 1px solid #d0d5dc;
    padding: 10px 12px;
    text-align: right;
    white-space: nowrap;
  }
  th:first-child, td:first-child { text-align: left; }

  thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #1f2937;
    color: #fff;
    font-weight: 600;
    text-align: center;
  }

  tbody tr:nth-child(even) { background: #f7f9fb; }
  tbody tr:hover { background: #e0ecff; }

  td.total-col { font-weight: 700; color: var(--red); }
  td.zero { color: #a0a7b1; text-align: center; }

  tfoot td {
    position: sticky;
    bottom: 0;
    background: #fff6c7;
    font-weight: 800;
    border-top: 2px solid #b8a43a;
  }
  .version {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 8px;
  }
  /* ---------- 雲端同步狀態列 ---------- */
  .sync-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: fit-content;
    max-width: 100%;
    margin: -12px auto 18px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.88rem;
    background: #e5e7eb;
    color: #374151;
  }
  .sync-bar.ok   { background: #dcfce7; color: #166534; }
  .sync-bar.busy { background: #dbeafe; color: #1e40af; }
  .sync-bar.err  { background: #fee2e2; color: #991b1b; }
  .sync-btn {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 1rem;
    padding: 0 2px;
  }
  .sync-bar.off .sync-btn { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>🤿 潛水旅費動態結算器</h1>
  <div class="sync-bar off" id="syncBar">
    <span id="syncText">⏳ 載入中…</span>
    <button type="button" class="sync-btn" id="btnSync" title="重新同步">🔄</button>
  </div>

  <!-- ===================== 第一畫面 ===================== -->
  <section id="inputView">
    <div class="card" id="formCard">
      <h2 id="formTitle">輸入成員資料</h2>
      <form id="memberForm" autocomplete="off">
        <div class="form-grid">
          <div class="field">
            <label for="name">姓名</label>
            <input type="text" id="name" placeholder="例如：小明">
          </div>
          <div class="field">
            <label for="shoreDive">岸潛支數 <span class="unit">($600/支)</span></label>
            <input type="number" id="shoreDive" min="0" value="0">
          </div>
          <div class="field">
            <label for="lodging">住宿晚數 <span class="unit">($600/晚)</span></label>
            <input type="number" id="lodging" min="0" value="0">
          </div>
          <div class="field">
            <label for="scooter">機車天數 <span class="unit">($175/天)</span></label>
            <input type="number" id="scooter" min="0" value="0">
          </div>
          <div class="field">
            <label for="insurance">保險天數 <span class="unit">($150/天)</span></label>
            <input type="number" id="insurance" min="0" value="0">
          </div>
          <div class="field">
            <label for="lunch">午餐天數 <span class="unit">($150/天)</span></label>
            <input type="number" id="lunch" min="0" value="0">
          </div>
          <div class="field">
            <label for="breakfast">早餐天數 <span class="unit">($80/天)</span></label>
            <input type="number" id="breakfast" min="0" value="0">
          </div>
          <label class="check-field">
            <input type="checkbox" id="ferry" checked>
            來回船票 <span class="unit">($1,340)</span>
          </label>
          <label class="check-field">
            <input type="checkbox" id="boatDive">
            參加船潛 <span class="unit">($2,500)</span>
          </label>
          <label class="check-field">
            <input type="checkbox" id="owCourse">
            OW課程 <span class="unit">($10,000)</span>
          </label>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn btn-blue" id="btnSubmit">➕ 結算這位成員，並加入名單</button>
          <button type="button" class="btn btn-gray" id="btnCancelEdit" style="display:none; flex:1 1 100%;">✖ 取消修正</button>
          <button type="button" class="btn btn-green" id="btnReport">📊 所有人輸入完畢！產生總對帳表</button>
          <button type="button" class="btn btn-red" id="btnClearAll">🗑️ 全部清空重來</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>已加入名單</h2>
      <div class="list-summary" id="listSummary"></div>
      <div class="member-list" id="memberList"></div>
    </div>
  </section>

  <!-- ===================== 第二畫面 ===================== -->
  <section id="reportView">
    <div class="card">
      <div class="report-header">
        <button type="button" class="btn btn-gray" id="btnBack">⬅ 返回繼續新增 / 修改</button>
        <h2 style="margin:0;">📊 總對帳表</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>姓名</th>
              <th>OW課程</th>
              <th>岸潛費</th>
              <th>船潛費</th>
              <th>保險費</th>
              <th>住宿費</th>
              <th>船票</th>
              <th>機車</th>
              <th>午餐</th>
              <th>早餐</th>
              <th>個人總應繳</th>
            </tr>
          </thead>
          <tbody id="reportBody"></tbody>
          <tfoot id="reportFoot"></tfoot>
        </table>
      </div>
    </div>
  </section>

  <p class="version">版本 4</p>
</div>

<script>
  /* ================= Google Sheet 連線設定 ================= */
  // Apps Script「網頁應用程式」的 /exec 網址；留空＝只存在本機
  const SHEET_URL = '';

  /* ================= 後台常數設定（固定單價） ================= */
  const PRICES = Object.freeze({
    shoreDive: 600,   // 岸潛（每支）
    lodging:   600,   // 住宿（每晚）
    scooter:   175,   // 機車分攤（每天）
    ferry:     1340,  // 船票（來回）
    boatDive:  2500,  // 船潛
    owCourse:  10000, // OW課程
    insurance: 150,   // 保險（每天）
    lunch:     150,   // 午餐（每天）
    breakfast: 80     // 早餐（每天）
  });

  // 對帳表欄位順序（不含姓名與總額）
  const FEE_COLUMNS = ['owCourse', 'shoreDive', 'boatDive', 'insurance', 'lodging', 'ferry', 'scooter', 'lunch', 'breakfast'];
  const NUM_FIELDS = ['shoreDive', 'lodging', 'scooter', 'insurance', 'lunch', 'breakfast'];
  const CHECK_FIELDS = ['ferry', 'boatDive', 'owCourse'];
  const STORAGE_KEY = 'diveCalculator_data';

  /* ================= 資料 ================= */
  let members = [];
  let nextId = 1;
  let editingId = null;     // 正在修正的成員 id（null = 一般新增模式）
  let formSnapshot = null;  // 進入修正前的表單內容，修正完會還原

  // 雲端同步狀態
  let serverRev = null;     // 雲端名單的版本號
  let dirty = false;        // 有還沒存到雲端的修改
  let forcePush = false;    // 第一次把舊的本機資料搬上雲端
  let changeSeq = 0;        // 名單每變動一次 +1
  let pendingOps = [];      // 還沒存到雲端的每一筆動作（別台裝置同時修改時用來合併）
  let syncing = false;
  let syncTimer = null;
  let retryTimer = null;

  /* ================= DOM ================= */
  const $ = (id) => document.getElementById(id);
  const form = $('memberForm');
  const inputView = $('inputView');
  const reportView = $('reportView');

  /* ================= 工具函式 ================= */
  // 讀取數字欄位：空白、負數、小數都安全處理成 >= 0 的整數
  function readCount(id) {
    const n = parseInt($(id).value, 10);
    return Number.isFinite(n) && n > 0 ? n : 0;
  }

  function formatNum(n) {
    return n.toLocaleString('en-US');
  }

  function formatMoney(n) {
    return '$' + formatNum(n);
  }

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  /* ================= 計算 ================= */
  // 由次數算出各項費用（從雲端或本機讀回來時也用這個，單價改了會自動套用）
  function buildMember(id, name, counts) {
    const c = {};
    FEE_COLUMNS.forEach((k) => {
      const n = Math.floor(Number(counts && counts[k]));
      c[k] = Number.isFinite(n) && n > 0 ? n : 0;
    });
    CHECK_FIELDS.forEach((k) => { c[k] = c[k] ? 1 : 0; });

    const fees = {};
    let total = 0;
    FEE_COLUMNS.forEach((k) => {
      fees[k] = c[k] * PRICES[k];
      total += fees[k];
    });
    return { id, name, counts: c, fees, total };
  }

  function calcMember(id) {
    const counts = {};
    NUM_FIELDS.forEach((k) => { counts[k] = readCount(k); });
    CHECK_FIELDS.forEach((k) => { counts[k] = $(k).checked ? 1 : 0; });
    return buildMember(id != null ? id : nextId++, $('name').value.trim(), counts);
  }

  /* ================= 表單內容 ================= */
  function getFormState() {
    const st = { name: $('name').value };
    NUM_FIELDS.forEach((k) => { st[k] = $(k).value; });
    CHECK_FIELDS.forEach((k) => { st[k] = $(k).checked; });
    return st;
  }

  function setFormState(st) {
    if (!st) return;
    $('name').value = st.name || '';
    NUM_FIELDS.forEach((k) => { if (st[k] != null) $(k).value = st[k]; });
    CHECK_FIELDS.forEach((k) => { $(k).checked = !!st[k]; });
  }

  /* ================= 本機暫存（雲端連不上時的備份） ================= */
  function saveLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        members: members.map((m) => ({ id: m.id, name: m.name, counts: m.counts })),
        nextId,
        // 修正中時存「修正前」的表單內容，避免重新整理後卡在修正模式
        form: editingId !== null ? formSnapshot : getFormState(),
        serverRev,
        dirty,
        forcePush,
        pendingOps
      }));
    } catch (e) { /* 瀏覽器不允許儲存時就略過 */ }
  }

  function loadLocal() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (Array.isArray(data.members)) {
        members = data.members.map((m) => buildMember(m.id, m.name, m.counts));
      }
      fixNextId(data.nextId);
      setFormState(data.form);

      if ('serverRev' in data) {
        serverRev = data.serverRev;
        dirty = !!data.dirty;
        forcePush = !!data.forcePush;
        pendingOps = Array.isArray(data.pendingOps) ? data.pendingOps : [];
      } else if (members.length) {
        // 版本 3 以前只存在本機的名單：第一次連上雲端時整份搬上去
        dirty = true;
        forcePush = true;
      }
    } catch (e) { /* 資料壞掉就從空白開始 */ }
  }

  function fixNextId(saved) {
    const maxId = members.reduce((mx, m) => Math.max(mx, m.id || 0), 0);
    nextId = Math.max(saved || 1, nextId, maxId + 1);
  }

  /* ================= 名單變動（新增 / 修正 / 刪除 / 清空） ================= */
  // op：{ t: 'add' | 'edit', m: 成員 } / { t: 'del', id } / { t: 'clear' }
  function membersChanged(op) {
    if (op) {
      if (op.m) op.m = { id: op.m.id, name: op.m.name, counts: op.m.counts };
      pendingOps.push(op);
    }
    dirty = true;
    changeSeq++;
    saveLocal();
    renderList();
    scheduleSync();
  }

  /* ================= 雲端同步 ================= */
  function setStatus(type, text) {
    $('syncBar').className = 'sync-bar ' + type;
    $('syncText').textContent = text;
  }

  async function api(payload) {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), 20000);
    try {
      const res = payload
        // 不設 Content-Type，避免瀏覽器先送 CORS 預檢（Apps Script 不支援）
        ? await fetch(SHEET_URL, { method: 'POST', body: JSON.stringify(payload), signal: ac.signal })
        : await fetch(SHEET_URL + (SHEET_URL.indexOf('?') >= 0 ? '&' : '?') + 'action=load&_=' + Date.now(), { signal: ac.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function scheduleSync(delay) {
    if (!SHEET_URL) return;
    if (dirty) setStatus('busy', '⏳ 準備存到 Google Sheet…');
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushToCloud, delay == null ? 800 : delay);
  }

  function syncFailed(text) {
    setStatus('err', text);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => (dirty ? pushToCloud() : pullFromCloud()), 15000);
  }

  // 把整份名單存到 Google Sheet
  async function pushToCloud() {
    if (!SHEET_URL || !dirty) return;
    if (syncing) { scheduleSync(); return; }
    syncing = true;
    clearTimeout(retryTimer);
    setStatus('busy', '⏳ 正在存到 Google Sheet…');
    const seq = changeSeq;
    const sentOps = pendingOps.length;
    try {
      const data = await api({
        action: 'save',
        rev: serverRev,
        force: forcePush,
        members: members.map((m) => ({ id: m.id, name: m.name, counts: m.counts, fees: m.fees, total: m.total }))
      });
      if (data.ok) {
        serverRev = data.rev;
        forcePush = false;
        pendingOps = pendingOps.slice(sentOps);
        if (seq === changeSeq) dirty = false;
        saveLocal();
        if (dirty) scheduleSync(0);
        else setStatus('ok', '☁️ 已存到 Google Sheet');
      } else if (data.conflict) {
        // 別台裝置剛存過：以雲端最新名單為底，把這台的修改重新套上去，再存一次
        mergeWithCloud(data);
        setStatus('busy', '⏳ 已合併另一台裝置的修改，正在存檔…');
        scheduleSync(0);
      } else {
        throw new Error(data.error || '儲存失敗');
      }
    } catch (err) {
      syncFailed('⚠️ 暫時存不到 Google Sheet（已先存在本機，稍後自動重試）');
    } finally {
      syncing = false;
    }
  }

  // 從 Google Sheet 讀回最新名單
  async function pullFromCloud() {
    if (!SHEET_URL) return;
    if (dirty) { pushToCloud(); return; }
    if (syncing) return;
    syncing = true;
    clearTimeout(retryTimer);
    setStatus('busy', '⏳ 正在讀取 Google Sheet…');
    try {
      const data = await api(null);
      if (!data.ok) throw new Error(data.error || '讀取失敗');
      if (!dirty) applyCloud(data); // 讀取途中若有新修改，以新修改為準
    } catch (err) {
      syncFailed('⚠️ 讀不到 Google Sheet，目前顯示本機暫存的資料');
    } finally {
      syncing = false;
      if (dirty) scheduleSync(0);
    }
  }

  function mergeWithCloud(data) {
    const list = (data.members || []).map((m) => buildMember(m.id, m.name, m.counts));
    let maxId = Math.max(nextId - 1, 0, ...list.map((m) => m.id));
    const remap = {};
    const newOps = [];

    pendingOps.forEach((op) => {
      if (op.t === 'clear') {
        list.length = 0;
        newOps.push(op);
      } else if (op.t === 'add') {
        let id = op.m.id;
        if (list.some((x) => x.id === id)) {   // 編號和別台新增的人撞到 → 換一個
          id = ++maxId;
          remap[op.m.id] = id;
          if (editingId === op.m.id) editingId = id;
        }
        maxId = Math.max(maxId, id);
        list.push(buildMember(id, op.m.name, op.m.counts));
        newOps.push({ t: 'add', m: { id, name: op.m.name, counts: op.m.counts } });
      } else if (op.t === 'edit') {
        const id = remap[op.m.id] || op.m.id;
        const idx = list.findIndex((x) => x.id === id);
        const m = buildMember(id, op.m.name, op.m.counts);
        if (idx !== -1) list[idx] = m; else list.push(m);
        newOps.push({ t: 'edit', m: { id, name: op.m.name, counts: op.m.counts } });
      } else if (op.t === 'del') {
        const id = remap[op.id] || op.id;
        for (let i = list.length - 1; i >= 0; i--) if (list[i].id === id) list.splice(i, 1);
        newOps.push({ t: 'del', id });
      }
    });

    members = list;
    pendingOps = newOps;
    serverRev = data.rev;
    forcePush = false;
    dirty = true;
    fixNextId(maxId + 1);

    if (editingId !== null && !members.some((m) => m.id === editingId)) {
      editingId = null;
      setFormState(formSnapshot);
      formSnapshot = null;
      updateEditUI();
    }
    saveLocal();
    renderList();
    if (reportView.style.display === 'block') renderReport();
  }

  function applyCloud(data) {
    members = (data.members || []).map((m) => buildMember(m.id, m.name, m.counts));
    fixNextId();
    serverRev = data.rev;
    dirty = false;
    forcePush = false;
    pendingOps = [];

    // 正在修正的人如果已經被別台裝置刪掉，就離開修正模式
    if (editingId !== null && !members.some((m) => m.id === editingId)) {
      editingId = null;
      setFormState(formSnapshot);
      formSnapshot = null;
      updateEditUI();
    }

    saveLocal();
    renderList();
    if (reportView.style.display === 'block') renderReport();
    setStatus('ok', '☁️ 已和 Google Sheet 同步');
  }

  /* ================= 加入 / 儲存修正 ================= */
  function addMember(e) {
    e.preventDefault();

    const name = $('name').value.trim();
    if (!name) {
      alert('請先輸入姓名喔！');
      $('name').focus();
      return;
    }

    if (editingId !== null) {
      // 修正模式：原位置更新
      const idx = members.findIndex((m) => m.id === editingId);
      const edited = calcMember(editingId);
      if (idx !== -1) members[idx] = edited;
      else members.push(edited);
      leaveEditMode();
      membersChanged({ t: 'edit', m: edited });
      $('name').focus();
      return;
    }

    const added = calcMember();
    members.push(added);
    resetFormForNext();
    membersChanged({ t: 'add', m: added });
  }

  // 清空：姓名、岸潛、保險、午餐、早餐、OW、船潛
  // 保留：住宿、機車、船票
  function resetFormForNext() {
    $('name').value = '';
    $('shoreDive').value = 0;
    $('insurance').value = 0;
    $('lunch').value = 0;
    $('breakfast').value = 0;
    $('owCourse').checked = false;
    $('boatDive').checked = false;
    $('name').focus();
  }

  /* ================= 修正成員 ================= */
  function startEdit(id) {
    const m = members.find((x) => x.id === id);
    if (!m) return;
    if (editingId === null) formSnapshot = getFormState(); // 記住原本正在打的內容

    editingId = id;
    const st = { name: m.name };
    NUM_FIELDS.forEach((k) => { st[k] = m.counts[k]; });
    CHECK_FIELDS.forEach((k) => { st[k] = m.counts[k] === 1; });
    setFormState(st);

    updateEditUI();
    renderList();
    $('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('name').focus();
  }

  // 離開修正模式，表單還原成修正前的內容
  function leaveEditMode() {
    editingId = null;
    setFormState(formSnapshot);
    formSnapshot = null;
    updateEditUI();
  }

  function cancelEdit() {
    leaveEditMode();
    saveLocal();
    renderList();
    $('name').focus();
  }

  function updateEditUI() {
    const editing = editingId !== null;
    const m = editing ? members.find((x) => x.id === editingId) : null;
    $('formTitle').textContent = editing ? `✏️ 修正中：${m ? m.name : ''}` : '輸入成員資料';
    $('btnSubmit').textContent = editing ? '💾 儲存修正' : '➕ 結算這位成員，並加入名單';
    $('btnSubmit').className = editing ? 'btn btn-orange' : 'btn btn-blue';
    $('btnCancelEdit').style.display = editing ? 'block' : 'none';
    $('formCard').classList.toggle('edit-mode', editing);
  }

  /* ================= 刪除成員 ================= */
  function deleteMember(id) {
    members = members.filter((m) => m.id !== id);
    if (id === editingId) leaveEditMode();
    membersChanged({ t: 'del', id });
  }

  /* ================= 列表預覽 ================= */
  function renderList() {
    const list = $('memberList');
    const summary = $('listSummary');

    if (members.length === 0) {
      list.innerHTML = '<div class="empty-hint">目前還沒有成員，從上方開始輸入吧！</div>';
      summary.innerHTML = '';
      return;
    }

    const grandTotal = members.reduce((sum, m) => sum + m.total, 0);
    summary.innerHTML =
      `<span>共 <strong>${members.length}</strong> 人</span>` +
      `<span>目前合計 <strong>${formatMoney(grandTotal)}</strong></span>`;

    list.innerHTML = members.map((m) => {
      const c = m.counts;
      const parts = [];
      if (c.owCourse) parts.push('OW課程');
      if (c.shoreDive) parts.push(`岸潛${c.shoreDive}支`);
      if (c.boatDive) parts.push('船潛');
      if (c.lodging) parts.push(`住${c.lodging}晚`);
      if (c.scooter) parts.push(`機車${c.scooter}天`);
      if (c.insurance) parts.push(`保險${c.insurance}天`);
      if (c.ferry) parts.push('船票');
      if (c.lunch) parts.push(`午餐${c.lunch}`);
      if (c.breakfast) parts.push(`早餐${c.breakfast}`);

      return `
        <div class="member-card${m.id === editingId ? ' editing' : ''}">
          <div class="member-info">
            <div class="member-name">${escapeHTML(m.name)}${m.id === editingId ? '<span class="edit-badge">修正中</span>' : ''}</div>
            <div class="member-total">${formatMoney(m.total)}</div>
            <div class="member-detail">${parts.join('・') || '無任何項目'}</div>
          </div>
          <div class="card-actions">
            <button type="button" class="btn btn-small btn-edit" data-action="edit" data-id="${m.id}">✏️ 修正</button>
            <button type="button" class="btn btn-small" data-action="delete" data-id="${m.id}">刪除重打</button>
          </div>
        </div>`;
    }).join('');
  }

  // 用事件委派處理「修正」與「刪除重打」
  $('memberList').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-id]');
    if (!btn) return;
    const id = Number(btn.dataset.id);
    const m = members.find((x) => x.id === id);
    if (!m) return;
    if (btn.dataset.action === 'edit') {
      startEdit(id);
    } else if (confirm(`確定要刪除「${m.name}」嗎？`)) {
      deleteMember(id);
    }
  });

  /* ================= 總對帳表 ================= */
  function cell(value) {
    return value === 0
      ? '<td class="zero">-</td>'
      : `<td>${formatNum(value)}</td>`;
  }

  function renderReport() {
    const body = $('reportBody');
    const foot = $('reportFoot');

    const colTotals = {};
    FEE_COLUMNS.forEach((k) => { colTotals[k] = 0; });
    let grandTotal = 0;

    body.innerHTML = members.map((m) => {
      FEE_COLUMNS.forEach((k) => { colTotals[k] += m.fees[k]; });
      grandTotal += m.total;
      return `<tr>
        <td>${escapeHTML(m.name)}</td>
        ${FEE_COLUMNS.map((k) => cell(m.fees[k])).join('')}
        <td class="total-col">${formatMoney(m.total)}</td>
      </tr>`;
    }).join('');

    foot.innerHTML = `<tr>
      <td>總計（${members.length} 人）</td>
      ${FEE_COLUMNS.map((k) => `<td>${colTotals[k] === 0 ? '-' : formatNum(colTotals[k])}</td>`).join('')}
      <td>${formatMoney(grandTotal)}</td>
    </tr>`;
  }

  /* ================= 畫面切換 ================= */
  function showReport() {
    if (editingId !== null) {
      alert('目前正在修正成員，請先按「儲存修正」或「取消修正」！');
      return;
    }
    if (members.length === 0) {
      alert('名單是空的，請先加入至少一位成員！');
      return;
    }
    renderReport();
    inputView.style.display = 'none';
    reportView.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showInput() {
    reportView.style.display = 'none';
    inputView.style.display = 'block';
    $('name').focus();
  }

  /* ================= 全部清空 ================= */
  function clearAll() {
    const msg = SHEET_URL
      ? '確定要清空所有成員嗎？\nGoogle Sheet 上的名單也會一起清空，無法復原。'
      : '確定要清空所有成員與輸入嗎？這個動作無法復原。';
    if (members.length > 0 && !confirm(msg)) return;
    members = [];
    editingId = null;
    formSnapshot = null;
    form.reset(); // 回到預設值（船票勾選、其他為 0 / 不勾）
    updateEditUI();
    membersChanged({ t: 'clear' });
    $('name').focus();
  }

  /* ================= 綁定事件 ================= */
  form.addEventListener('submit', addMember); // 在任一欄位按 Enter 也能加入
  form.addEventListener('input', saveLocal);  // 打到一半也先存在本機
  form.addEventListener('change', saveLocal);
  $('btnReport').addEventListener('click', showReport);
  $('btnBack').addEventListener('click', showInput);
  $('btnClearAll').addEventListener('click', clearAll);
  $('btnCancelEdit').addEventListener('click', cancelEdit);
  $('btnSync').addEventListener('click', () => (dirty ? pushToCloud() : pullFromCloud()));

  // 切回這個分頁時，抓別台裝置的最新名單
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') pullFromCloud();
  });

  /* ================= 初始化 ================= */
  loadLocal();
  updateEditUI();
  renderList();
  if (SHEET_URL) {
    if (dirty) pushToCloud();
    else pullFromCloud();
  } else {
    setStatus('off', '💾 目前只存在這台裝置（尚未連接 Google Sheet）');
  }
  $('name').focus();
</script>
</body>
</html>
